<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-labelledby="title desc">
  <title id="title">Top Languages by Repo</title>
  <desc id="desc">Public repository source-code distribution: TypeScript 55.4%, Python 33.6%, JavaScript 6.0%, CSS 4.7%, HTML 0.2%, and Bash or Shell 0.1%.</desc>
  <style>
    .title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .language { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .percent { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: end; }
    .center-main { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; text-anchor: middle; }
    .center-sub { font: 500 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
  </style>

  <rect x="0.5" y="0.5" width="339" height="199" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="34" class="title">Top Languages by Repo</text>

  <circle cx="25" cy="62" r="4.5" fill="#3178c6"/>
  <text x="37" y="66" class="language">TypeScript</text>
  <text x="151" y="66" class="percent">55.4%</text>

  <circle cx="25" cy="84" r="4.5" fill="#3572A5"/>
