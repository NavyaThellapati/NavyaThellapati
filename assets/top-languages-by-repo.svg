    <circle cx="255" cy="112" r="54" pathLength="100" fill="none" stroke="#e34c26" stroke-width="20" stroke-dasharray="0.17113607 99.82886393" stroke-dashoffset="-99.72092160"/>
    <circle cx="255" cy="112" r="54" pathLength="100" fill="none" stroke="#89e051" stroke-width="20" stroke-dasharray="0.10794233 99.89205767" stroke-dashoffset="-99.89205767"/>
