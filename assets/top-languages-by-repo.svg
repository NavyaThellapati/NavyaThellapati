<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200" role="img" aria-labelledby="title desc">
  <title id="title">Top Languages by Repo</title>
  <desc id="desc">A solid pie chart based on source-language bytes in public repositories, with a legend for Python, SQL, TypeScript, JavaScript, Bash, HTML, and CSS. SQL is listed but has no visible slice because GitHub Linguist detects no SQL source.</desc>
  <style>
    .title { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .language { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
  </style>

  <rect x="0.5" y="0.5" width="339" height="199" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="32" class="title">Top Languages by Repo</text>

  <circle cx="25" cy="56" r="4.5" fill="#3572A5"/>
  <text x="37" y="60" class="language">Python</text>

  <circle cx="25" cy="76" r="4.5" fill="#e38c00"/>
  <text x="37" y="80" class="language">SQL</text>

  <circle cx="25" cy="96" r="4.5" fill="#3178c6"/>
  <text x="37" y="100" class="language">TypeScript</text>

  <circle cx="25" cy="116" r="4.5" fill="#f1e05a"/>
  <text x="37" y="120" class="language">JavaScript</text>

  <circle cx="25" cy="136" r="4.5" fill="#89e051"/>
  <text x="37" y="140" class="language">Bash</text>

  <circle cx="25" cy="156" r="4.5" fill="#e34c26"/>
  <text x="37" y="160" class="language">HTML</text>

  <circle cx="25" cy="176" r="4.5" fill="#563d7c"/>
  <text x="37" y="180" class="language">CSS</text>

